openapi: 3.0.3
info:
  title: Cloudberries API
  version: 1.0.0
  description: |
    P2P-маркетплейс вычислительных мощностей с эскроу и арбитражем.

    Публичный API для клиентов, провайдеров и администраторов.
    Node Agent общается с платформой по gRPC (proto/agent.proto) и в этот
    OpenAPI-контракт не входит. Все денежные POST-операции идемпотентны по
    заголовку `Idempotency-Key`.
  license:
    name: Proprietary
servers:
  - url: https://api.cloudberries.ru/api/v1
    description: Production
  - url: https://staging-api.cloudberries.ru/api/v1
    description: Staging
  - url: http://localhost:8080/api/v1
    description: Local development
security:
  - BearerAuth: []
tags:
  - name: Auth
    description: Регистрация, вход, refresh, KYC
  - name: Catalog
    description: Публичный каталог нод
  - name: Nodes
    description: Онбординг и управление нодами провайдера
  - name: Bookings
    description: Бронирование, оплата, доступ
  - name: Disputes
    description: Споры сторон
  - name: Arbitration
    description: Арбитраж (ADMIN)
  - name: Wallet
    description: Баланс и история транзакций
  - name: Payouts
    description: Выплаты провайдеру
  - name: Admin
    description: Модерация, KYC, аналитика, комиссии
  - name: Webhooks
    description: Входящие вебхуки внешних провайдеров

paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Регистрация клиента или провайдера
      security: []
      x-public: true
      x-required-roles: []
      x-required-scopes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Вход по email и паролю
      security: []
      x-public: true
      x-required-roles: []
      x-required-scopes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Токены выданы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshTokens
      summary: Обновить access token по refresh token
      security: []
      x-public: true
      x-required-roles: []
      x-required-scopes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Отозвать refresh token и занести access token в blacklist
      x-required-roles: [CLIENT, PROVIDER, ADMIN]
      x-required-scopes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Выход выполнен
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/verify:
    post:
      tags: [Auth]
      operationId: submitVerification
      summary: Отправить документы на KYC-верификацию (PROVIDER)
      x-required-roles: [PROVIDER]
      x-required-scopes: [verifications:submit]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '202':
          description: Документы приняты, статус PENDING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Профиль текущего пользователя
      x-required-roles: [CLIENT, PROVIDER, ADMIN]
      x-required-scopes: []
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /nodes:
    get:
      tags: [Catalog]
      operationId: searchNodes
      summary: Поиск доступных нод
      security: []
      x-public: true
      x-required-roles: []
      x-required-scopes: []
      parameters:
        - name: gpu
          in: query
          description: Только ноды с GPU
          schema:
            type: boolean
        - name: region
          in: query
          description: Регион размещения
          schema:
            type: string
            example: msk-1
        - name: price_max
          in: query
          description: Максимальная цена за час, RUB
          schema:
            type: number
            multipleOf: 0.01
            minimum: 0
        - name: cpu_min
          in: query
          description: Минимальное число CPU-ядер
          schema:
            type: integer
            minimum: 1
        - name: ram_min
          in: query
          description: Минимальный объём RAM, GB
          schema:
            type: integer
            minimum: 1
        - name: status
          in: query
          description: Фильтр по статусу (по умолчанию только ONLINE)
          schema:
            $ref: '#/components/schemas/NodeStatus'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Список нод; пустой результат возвращает items []
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Nodes]
      operationId: startNodeOnboarding
      summary: Инициировать онбординг ноды и получить install token
      x-required-roles: [PROVIDER]
      x-required-scopes: [nodes:create]
      responses:
        '201':
          description: Токен установки создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeOnboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /nodes/{id}:
    get:
      tags: [Catalog]
      operationId: getNode
      summary: Детали ноды
      security: []
      x-public: true
      x-required-roles: []
      x-required-scopes: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Детали ноды
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Nodes]
      operationId: updateNode
      summary: Настроить цену и расписание своей ноды
      x-required-roles: [PROVIDER, ADMIN]
      # PROVIDER меняет свою ноду (nodes:update_own), ADMIN — в рамках модерации.
      x-required-scopes: [nodes:update_own, nodes:moderate]
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeUpdateRequest'
      responses:
        '200':
          description: Конфигурация обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /nodes/{id}/enable:
    post:
      tags: [Nodes]
      operationId: enableNode
      summary: Включить доступность ноды
      x-required-roles: [PROVIDER, ADMIN]
      x-required-scopes: [nodes:enable_own, nodes:moderate]
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Нода включена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /nodes/{id}/disable:
    post:
      tags: [Nodes]
      operationId: disableNode
      summary: Выключить доступность ноды
      x-required-roles: [PROVIDER, ADMIN]
      x-required-scopes: [nodes:disable_own, nodes:moderate]
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Нода выключена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /bookings:
    get:
      tags: [Bookings]
      operationId: listBookings
      summary: Список броней текущего пользователя
      x-required-roles: [CLIENT, PROVIDER, ADMIN]
      x-required-scopes: [bookings:read]
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/BookingStatus'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Список броней
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Bookings]
      operationId: createBooking
      summary: Создать бронь (UC-1 шаг 3)
      x-required-roles: [CLIENT]
      x-required-scopes: [bookings:create]
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '201':
          description: Бронь создана, нода зарезервирована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '200':
          description: Повторный запрос с тем же Idempotency-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /bookings/{id}:
    get:
      tags: [Bookings]
      operationId: getBooking
      summary: Детали брони
      x-required-roles: [CLIENT, PROVIDER, ADMIN]
      x-required-scopes: [bookings:read]
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Детали брони
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /bookings/{id}/cancel:
    post:
      tags: [Bookings]
      operationId: cancelBooking
      summary: Отменить бронь до оплаты (UC-1 alt 3a)
      x-required-roles: [CLIENT]
      x-required-scopes: [bookings:cancel]
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '204':
          description: Бронь отменена, резерв снят
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /bookings/{id}/pay:
    post:
      tags: [Bookings]
      operationId: payBooking
      summary: Оплатить бронь и запустить асинхронную активацию (UC-1 шаги 4-8)
      x-required-roles: [CLIENT]
      x-required-scopes: [bookings:pay]
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayRequest'
      responses:
        '200':
          description: Оплата подтверждена, обработка активации завершена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
        '202':
          description: Платёж принят или ожидает webhook/активацию; состояние брони нужно опрашивать
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /bookings/{id}/complete:
    post:
      tags: [Bookings]
      operationId: completeBooking
      summary: Завершить аренду (UC-1 шаг 10 / alt 9a)
      description: |
        Клиент завершает свою ACTIVE-бронь досрочно. ADMIN может завершить
        бронь принудительно (scope bookings:force_complete). Завершение по
        таймеру выполняет фоновый job и публикует BookingCompleted; отдельный
        публичный эндпоинт для него не нужен.
      x-required-roles: [CLIENT, ADMIN]
      # CLIENT завершает свою бронь (bookings:complete), ADMIN — принудительно
      # (bookings:force_complete). Достаточно любого из scopes.
      x-required-scopes: [bookings:complete, bookings:force_complete]
      x-authorization:
        - roles: [CLIENT]
          scopes: [bookings:complete]
        - roles: [ADMIN]
          scopes: [bookings:force_complete]
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRequest'
      responses:
        '200':
          description: Аренда завершена, выполнены расчёт и распределение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /bookings/{id}/credentials:
    get:
      tags: [Bookings]
      operationId: getBookingCredentials
      summary: Получить SSH-доступ к активной брони (UC-1 шаг 9)
      x-required-roles: [CLIENT]
      x-required-scopes: [bookings:credentials]
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Учётные данные для SSH; пароль отдаётся только владельцу брони
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessCredentials'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '500':
          $ref: '#/components/responses/InternalError'

  /disputes:
    get:
      tags: [Disputes]
      operationId: listDisputes
      summary: Список споров текущего пользователя
      x-required-roles: [CLIENT, PROVIDER, ADMIN]
      x-required-scopes: [disputes:read]
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DisputeStatus'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Список споров
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Disputes]
      operationId: openDispute
      summary: Открыть спор по брони (UC-3 шаг 1)
      x-required-roles: [CLIENT, PROVIDER]
      x-required-scopes: [disputes:create]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeRequest'
      responses:
        '201':
          description: Спор создан, эскроу заморожен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /disputes/{id}:
    get:
      tags: [Disputes]
      operationId: getDispute
      summary: Детали спора и доказательства
      x-required-roles: [CLIENT, PROVIDER, ADMIN]
      x-required-scopes: [disputes:read]
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Материалы спора
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /arbitration/disputes:
    get:
      tags: [Arbitration]
      operationId: listArbitrationDisputes
      summary: Очередь споров для арбитра
      x-required-roles: [ADMIN]
      x-required-scopes: [disputes:read_all]
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DisputeStatus'
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Список споров
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
