  /webhooks/payments/yookassa:
    post:
      tags: [Webhooks]
      operationId: yookassaWebhook
      summary: Вебхук ЮKassa (payment.succeeded / payment.canceled)
      description: |
        Публичный эндпоинт без JWT. Аутентификация — по IP-адресам ЮKassa и
        повторной проверке платежа через API провайдера. Тело обрабатывается
        идемпотентно по `object.id`.
      security: []
      x-public: true
      x-required-roles: []
      x-required-scopes: []
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
          description: Идентификатор доставки для трассировки
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YooKassaNotification'
      responses:
        '200':
          description: Уведомление принято
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PathId:
      name: id
      in: path
      required: true
      description: UUID ресурса
      schema:
        type: string
        format: uuid
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID v7, стабильный для всех ретраев одной операции
      schema:
        type: string
        format: uuid
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: UUID v7; рекомендуется для безопасных ретраев
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      description: Размер страницы
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      description: Смещение от начала выборки
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Требуется аутентификация
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Недостаточно прав или чужой ресурс
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Конфликт состояния или повторное использование ключа
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Семантическая ошибка (нода недоступна, лимит, просроченный спор)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PaymentRequired:
      description: Платёж отклонён (UC-1 alt 5a)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Gone:
      description: Ресурс истёк или отозван
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Превышен rate limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Внешний сервис недоступен (UC-1 alt 4a)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GatewayTimeout:
      description: Node Agent не ответил за отведённое время (UC-1 alt 8a)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Внутренняя ошибка
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Role:
      type: string
      enum: [CLIENT, PROVIDER, ADMIN]

    BookingStatus:
      type: string
      enum: [PENDING, ACTIVE, COMPLETED, CANCELLED, DISPUTED]

    NodeStatus:
      type: string
      enum: [INACTIVE, ONLINE, BUSY, MAINTENANCE, OFFLINE, DISPUTED]

    EscrowStatus:
      type: string
      enum: [HOLD, CAPTURED, FROZEN, REFUNDED, PARTIAL_REFUND]

    DisputeStatus:
      type: string
      enum: [OPEN, EVIDENCE_REQUESTED, SETTLEMENT, RESOLVED, CLOSED]

    PayoutStatus:
      type: string
      enum: [REQUESTED, PROCESSING, PAID, FAILED]

    LedgerEntryType:
      type: string
      enum: [CREDIT, DEBIT, FEE, REFUND]

    Decision:
      type: string
      enum: [REFUND_CLIENT, PAY_PROVIDER, SPLIT]

    EvidenceType:
      type: string
      enum: [TELEMETRY, LOG, SCREENSHOT, MESSAGE]

    VerificationStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]

    ErrorResponse:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - NOT_FOUND
            - CONFLICT
            - UNAUTHORIZED
            - FORBIDDEN
            - PAYMENT_REQUIRED
            - AGENT_TIMEOUT
            - RATE_LIMITED
            - INTERNAL_ERROR
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    RegisterRequest:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        role:
          type: string
          enum: [CLIENT, PROVIDER]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: Opaque refresh token, хранится в виде хеша

    VerifyRequest:
      type: object
      required: [doc_type, file_id]
      properties:
        doc_type:
          type: string
          enum: [PASSPORT, INN, SELF_EMPLOYED, COMPANY]
        file_id:
          type: string
          format: uuid
        comment:
          type: string
          maxLength: 1000

    VerificationStatusResponse:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/VerificationStatus'

    UserProfile:
      type: object
      required: [id, email, role, verification_status, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        verification_status:
          $ref: '#/components/schemas/VerificationStatus'
        created_at:
          type: string
          format: date-time

    AuthResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: TTL access token в секундах
          example: 900

    HardwareSpecs:
      type: object
      required: [cpu_cores, ram_gb, disk_gb]
      properties:
        cpu_model:
          type: string
        gpu_model:
          type: string
          nullable: true
        gpu_vram_gb:
          type: integer
          nullable: true
          minimum: 1
        cpu_cores:
          type: integer
          minimum: 1
        ram_gb:
          type: integer
          minimum: 1
        disk_gb:
          type: integer
          minimum: 1

    AvailabilitySlot:
      type: object
      required: [day_of_week, from_time, to_time]
      properties:
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
        from_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '09:00'
        to_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '21:00'

    NodeSummary:
      type: object
      required: [id, cpu_cores, ram_gb, price_per_hour, region, status, reputation]
      properties:
        id:
          type: string
          format: uuid
        gpu_model:
          type: string
          nullable: true
        gpu_vram_gb:
          type: integer
          nullable: true
        cpu_cores:
          type: integer
        ram_gb:
          type: integer
        price_per_hour:
          type: number
          multipleOf: 0.01
          minimum: 0
        region:
          type: string
        status:
          $ref: '#/components/schemas/NodeStatus'
        reputation:
          type: number
          format: float
          minimum: 0
          maximum: 5

    NodeDetail:
      allOf:
        - $ref: '#/components/schemas/NodeSummary'
        - type: object
          properties:
            hardware_specs:
              $ref: '#/components/schemas/HardwareSpecs'
            schedule:
              type: array
              items:
                $ref: '#/components/schemas/AvailabilitySlot'

    NodeListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NodeSummary'
        total:
          type: integer

    NodeOnboardResponse:
      type: object
      required: [install_token, script_url, expires_at]
      properties:
        install_token:
          type: string
          description: Одноразовый токен для Node Agent
        script_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time

    NodeUpdateRequest:
      type: object
      minProperties: 1
      properties:
        price_per_hour:
          type: number
          multipleOf: 0.01
          minimum: 0
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilitySlot'

    BookingRequest:
      type: object
      required: [node_id, duration_minutes]
      properties:
        node_id:
          type: string
          format: uuid
        duration_minutes:
          type: integer
          minimum: 1
          maximum: 10080
          description: Минимум 60 минут проверяется PricingPolicy

    BookingResponse:
      type: object
      required: [id, status, price_snapshot, planned_duration_minutes, node_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        node_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/BookingStatus'
        price_snapshot:
          type: number
          multipleOf: 0.01
          minimum: 0
        planned_duration_minutes:
          type: integer
        created_at:
          type: string
          format: date-time

    BookingDetail:
      allOf:
        - $ref: '#/components/schemas/BookingResponse'
        - type: object
          properties:
            started_at:
              type: string
              format: date-time
              nullable: true
            ended_at:
              type: string
              format: date-time
              nullable: true
            total_amount:
              type: number
              multipleOf: 0.01
              minimum: 0
            escrow_status:
              $ref: '#/components/schemas/EscrowStatus'

    BookingListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BookingResponse'
        total:
          type: integer

    AccessCredentials:
      type: object
      required: [ip, port, ssh_login, expires_at]
      properties:
        ip:
          type: string
          format: ipv4
        port:
          type: integer
          minimum: 1
          maximum: 65535
        ssh_login:
          type: string
