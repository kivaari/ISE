    YooKassaNotification:
      type: object
      required: [type, event, object]
      properties:
        type:
          type: string
          enum: [notification]
        event:
          type: string
          enum: [payment.succeeded, payment.canceled, refund.succeeded]
        object:
          type: object
          required: [id, status, amount]
          properties:
            id:
              type: string
            status:
              type: string
              enum: [pending, waiting_for_capture, succeeded, canceled]
            amount:
              type: object
              required: [value, currency]
              properties:
                value:
                  type: string
                  pattern: '^[0-9]+\.[0-9]{2}$'
                currency:
                  type: string
                  enum: [RUB]
            metadata:
              type: object
              additionalProperties:
                type: string
