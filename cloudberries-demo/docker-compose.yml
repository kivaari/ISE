services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: berries
      POSTGRES_PASSWORD: berries
      POSTGRES_DB: cloudberries
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"