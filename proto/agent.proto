syntax = "proto3";

package cloudberries.agent.v1;

option go_package = "cloudberries/proto/agent/v1;agentv1";

service NodeAgentService {
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc SendHeartbeat(stream Heartbeat) returns (Ack);
  rpc StreamMetrics(stream MetricsBatch) returns (Ack);
  rpc StartContainer(StartContainerRequest) returns (StartContainerResponse);
  rpc StopContainer(StopContainerRequest) returns (Ack);
}

message RegisterNodeRequest {
  string install_token = 1;
  HardwareSpecs specs = 2;
  string agent_version = 3;
}

message RegisterNodeResponse { string node_id = 1; string connection_token = 2; }

message HardwareSpecs {
  int32 cpu_cores = 1;
  int32 ram_gb = 2;
  optional string gpu_model = 3;
  optional int32 gpu_vram_gb = 4;
  int32 disk_gb = 5;
}

message Heartbeat {
  string node_id = 1;
  int64 timestamp_unix_ms = 2;
  double cpu_load = 3;
  int64 ram_used_mb = 4;
}

message MetricsBatch { string node_id = 1; string session_id = 2; repeated MetricSnapshot snapshots = 3; }

message MetricSnapshot {
  int64 recorded_at_unix_ms = 1;
  optional double cpu_load = 2;
  optional int64 ram_used_mb = 3;
  optional double gpu_load = 4;
  optional double gpu_temp = 5;
  optional double disk_io_mbps = 6;
}

message StartContainerRequest { string node_id = 1; string booking_id = 2; AccessCredentials credentials = 3; }
message StartContainerResponse { string host = 1; uint32 port = 2; }
message StopContainerRequest { string booking_id = 1; }
message AccessCredentials { string ssh_login = 1; string ssh_public_key = 2; string expires_at = 3; }
message Ack { bool accepted = 1; string message = 2; }
